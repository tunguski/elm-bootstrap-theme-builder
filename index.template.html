<!DOCTYPE html>
<!-- data-theme=dark applies the editor shell's dark theme (the gallery sets this via theme.js; this
     standalone page sets it directly so the editor chrome matches the elm-lang editor). -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap 5.3 theme builder</title>
    <!-- The reusable editor shell's chrome (file pane, code editing, resizable panes, …). -->
    <link rel="stylesheet" href="editor.css" />
    <style>
      /* The Bootstrap builder's bits, layered on top of the editor shell (.ed-* / seg-* classes). */
      html, body { margin: 0; height: 100%; }
      #app { height: 100%; }

      /* CSS syntax-highlighting token colours for the shell's code pane (its seg-<kind> classes). */
      .seg-com { color: #6b6b86; font-style: italic; }
      .seg-sel { color: #f0c674; }
      .seg-prop { color: #82aaff; }
      .seg-val { color: #c3e88d; }
      .seg-num { color: #f78c6c; }
      .seg-var { color: #80cbc4; }
      .seg-str { color: #c3e88d; }
      .seg-kw { color: #c792ea; }
      .seg-op { color: #8a8aa6; }

      /* The Bootstrap preview pane: a small toolbar above a full-height preview iframe. */
      .bs-preview { display: flex; flex-direction: column; height: 100%; min-height: 0; gap: 8px; }
      .bs-toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
      .bs-btn { font: inherit; font-size: 13px; color: #e6edf3; background: #1b2747; border: 1px solid #2a3550;
                border-radius: 6px; padding: 6px 12px; cursor: pointer; }
      .bs-btn:hover { border-color: #3a7bd5; }
      #preview-frame { flex: 1; width: 100%; min-height: 0; border: 1px solid #2a3550; border-radius: 8px;
                       background: #fff; display: block; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="app.js"></script>
    <script>
      // The example page rendered inside the preview iframe — a "simple template" that exercises a
      // broad slice of Bootstrap components so theme changes are visible at a glance.
      var EXAMPLE_HTML =
        '<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">' +
        '  <div class="container-fluid">' +
        '    <a class="navbar-brand" href="#">ThemeCo</a>' +
        '    <div class="navbar-nav me-auto">' +
        '      <a class="nav-link active" href="#">Home</a>' +
        '      <a class="nav-link" href="#">Features</a>' +
        '      <a class="nav-link" href="#">Pricing</a>' +
        '    </div>' +
        '    <button class="btn btn-light btn-sm">Sign up</button>' +
        '  </div>' +
        '</nav>' +
        '<div class="container py-4">' +
        '  <div class="p-4 mb-4 rounded-3 bg-body-tertiary">' +
        '    <h1 class="display-6">Your Bootstrap theme, live</h1>' +
        '    <p class="lead mb-3 text-secondary">Uncomment a variable on the left and watch this page restyle itself.</p>' +
        '    <button class="btn btn-primary btn-lg me-2">Primary action</button>' +
        '    <button class="btn btn-outline-secondary btn-lg">Learn more</button>' +
        '  </div>' +
        '  <h6 class="text-uppercase text-secondary">Buttons</h6>' +
        '  <div class="mb-2">' +
        '    <button class="btn btn-primary m-1">Primary</button>' +
        '    <button class="btn btn-secondary m-1">Secondary</button>' +
        '    <button class="btn btn-success m-1">Success</button>' +
        '    <button class="btn btn-danger m-1">Danger</button>' +
        '    <button class="btn btn-warning m-1">Warning</button>' +
        '    <button class="btn btn-info m-1">Info</button>' +
        '    <button class="btn btn-light m-1">Light</button>' +
        '    <button class="btn btn-dark m-1">Dark</button>' +
        '    <button class="btn btn-link m-1">Link</button>' +
        '  </div>' +
        '  <div class="mb-4">' +
        '    <button class="btn btn-outline-primary m-1">Primary</button>' +
        '    <button class="btn btn-outline-secondary m-1">Secondary</button>' +
        '    <button class="btn btn-outline-success m-1">Success</button>' +
        '    <button class="btn btn-outline-danger m-1">Danger</button>' +
        '  </div>' +
        '  <div class="row g-4 mb-4">' +
        '    <div class="col-md-6">' +
        '      <div class="card h-100">' +
        '        <div class="card-header">Featured card</div>' +
        '        <div class="card-body">' +
        '          <h5 class="card-title">Card title <span class="badge text-bg-primary">New</span></h5>' +
        '          <p class="card-text text-secondary">A card shows how surfaces, borders and radii respond to your theme.</p>' +
        '          <a href="#" class="btn btn-primary">Go somewhere</a>' +
        '        </div>' +
        '        <div class="card-footer text-secondary">Updated just now</div>' +
        '      </div>' +
        '    </div>' +
        '    <div class="col-md-6">' +
        '      <form class="card card-body">' +
        '        <div class="mb-3">' +
        '          <label class="form-label">Email address</label>' +
        '          <input type="email" class="form-control" placeholder="name@example.com">' +
        '        </div>' +
        '        <div class="mb-3">' +
        '          <label class="form-label">Plan</label>' +
        '          <select class="form-select"><option>Starter</option><option>Pro</option><option>Team</option></select>' +
        '        </div>' +
        '        <div class="form-check mb-3">' +
        '          <input class="form-check-input" type="checkbox" id="ck" checked>' +
        '          <label class="form-check-label" for="ck">Email me product updates</label>' +
        '        </div>' +
        '        <input type="range" class="form-range mb-3" value="60">' +
        '        <button type="button" class="btn btn-success">Save changes</button>' +
        '      </form>' +
        '    </div>' +
        '  </div>' +
        '  <div class="row g-4 mb-4">' +
        '    <div class="col-md-7">' +
        '      <div class="alert alert-primary">A simple primary alert with <a href="#" class="alert-link">a link</a>.</div>' +
        '      <div class="alert alert-success mb-0">Saved! Your theme is looking great.</div>' +
        '    </div>' +
        '    <div class="col-md-5">' +
        '      <p class="mb-1"><span class="badge text-bg-primary">Primary</span> ' +
        '         <span class="badge text-bg-success">Success</span> ' +
        '         <span class="badge text-bg-danger">Danger</span> ' +
        '         <span class="badge text-bg-warning">Warning</span></p>' +
        '      <div class="progress mb-2" role="progressbar"><div class="progress-bar" style="width: 65%">65%</div></div>' +
        '      <div class="progress" role="progressbar"><div class="progress-bar bg-success" style="width: 40%">40%</div></div>' +
        '    </div>' +
        '  </div>' +
        '  <ul class="nav nav-pills mb-3">' +
        '    <li class="nav-item"><a class="nav-link active" href="#">Active</a></li>' +
        '    <li class="nav-item"><a class="nav-link" href="#">Tab two</a></li>' +
        '    <li class="nav-item"><a class="nav-link" href="#">Tab three</a></li>' +
        '  </ul>' +
        '  <div class="row g-4">' +
        '    <div class="col-md-6">' +
        '      <ul class="list-group">' +
        '        <li class="list-group-item d-flex justify-content-between align-items-center">Inbox <span class="badge text-bg-primary rounded-pill">14</span></li>' +
        '        <li class="list-group-item active">Selected item</li>' +
        '        <li class="list-group-item">A third item</li>' +
        '      </ul>' +
        '    </div>' +
        '    <div class="col-md-6">' +
        '      <table class="table table-striped">' +
        '        <thead><tr><th>#</th><th>Name</th><th>Status</th></tr></thead>' +
        '        <tbody>' +
        '          <tr><td>1</td><td>Ada</td><td><span class="badge text-bg-success">active</span></td></tr>' +
        '          <tr><td>2</td><td>Linus</td><td><span class="badge text-bg-secondary">idle</span></td></tr>' +
        '          <tr><td>3</td><td>Grace</td><td><span class="badge text-bg-danger">blocked</span></td></tr>' +
        '        </tbody>' +
        '      </table>' +
        '      <nav><ul class="pagination">' +
        '        <li class="page-item disabled"><a class="page-link" href="#">Prev</a></li>' +
        '        <li class="page-item active"><a class="page-link" href="#">1</a></li>' +
        '        <li class="page-item"><a class="page-link" href="#">2</a></li>' +
        '        <li class="page-item"><a class="page-link" href="#">Next</a></li>' +
        '      </ul></nav>' +
        '    </div>' +
        '  </div>' +
        '</div>';

      (function () {
        var BOOTSTRAP = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css";

        var lastCss = "";
        var theme = "light";
        var built = false;

        function frame() { return document.getElementById("preview-frame"); }

        function frameDoc() {
          return '<!doctype html><html lang="en" data-bs-theme="' + theme + '">' +
            '<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
            '<link href="' + BOOTSTRAP + '" rel="stylesheet">' +
            '<style id="bs-custom-theme">' + lastCss + '</style>' +
            '</head><body>' + EXAMPLE_HTML + '</body></html>';
        }

        // Build the iframe once. Edits/toggles only touch the <style> element or the root attribute
        // afterwards, so Bootstrap is never re-fetched and the preview never flickers.
        function build() {
          var f = frame();
          if (!f || built) return;
          built = true;
          f.addEventListener("load", function () {
            try {
              var doc = f.contentDocument;
              var el = doc && doc.getElementById("bs-custom-theme");
              if (el) el.textContent = lastCss;
              if (doc && doc.documentElement) doc.documentElement.setAttribute("data-bs-theme", theme);
            } catch (e) {}
          });
          f.setAttribute("srcdoc", frameDoc());
        }

        function applyCss(css) {
          lastCss = css == null ? "" : css;
          if (!built) { build(); return; }
          try {
            var doc = frame() && frame().contentDocument;
            var el = doc && doc.getElementById("bs-custom-theme");
            if (el) el.textContent = lastCss;
          } catch (e) {}
        }

        function applyTheme(t) {
          theme = t;
          try {
            var doc = frame() && frame().contentDocument;
            if (doc && doc.documentElement) doc.documentElement.setAttribute("data-bs-theme", t);
          } catch (e) {}
        }

        function copy(txt) {
          if (navigator.clipboard) { navigator.clipboard.writeText(txt).catch(function () {}); }
        }

        // The compiled elm-lang app exposes its ports on window.$app; it may mount a tick after this
        // script runs, so poll briefly until the ports (and the iframe element) exist.
        function wire() {
          if (!window.$app || !window.$app.ports) { setTimeout(wire, 30); return; }
          var p = window.$app.ports;
          if (p.renderCss) p.renderCss.subscribe(applyCss);
          if (p.setPreviewTheme) p.setPreviewTheme.subscribe(applyTheme);
          if (p.copyToClipboard) p.copyToClipboard.subscribe(copy);
          (function ensureFrame() { if (frame()) build(); else setTimeout(ensureFrame, 30); })();
        }
        wire();
      })();
    </script>
  </body>
</html>
